<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Akisanya Emmanuel Ifedayo</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="contact-container">
      <a href="index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to CV
      </a>

      <div class="contact-content">
        <div class="contact-header">
          <h1>Get In Touch</h1>
          <p class="contact-subtitle">Feel free to reach out for collaborations or just a friendly hello</p>
        </div>

        <div class="contact-info-section">
          <div class="info-card">
            <div class="info-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M3 8L10.89 13.26C11.23 13.47 11.61 13.59 12 13.59C12.39 13.59 12.77 13.47 13.11 13.26L21 8M5 19H19C20.1 19 21 18.1 21 17V7C21 5.9 20.1 5 19 5H5C3.9 5 3 5.9 3 7V17C3 18.1 3.9 19 5 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="info-content">
              <h3>Email</h3>
              <a href="mailto:ifedayoakisanya@gmail.com">ifedayoakisanya@gmail.com</a>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M22 16.92V19.92C22 20.49 21.54 20.97 20.97 21C20.72 21.01 20.46 21.02 20.21 21.02C10.2 21.02 2 12.82 2 2.81C2 2.56 2.01 2.3 2.02 2.05C2.05 1.48 2.53 1.02 3.1 1.02H6.1C6.6 1.02 7.01 1.39 7.07 1.88C7.18 2.86 7.4 3.81 7.71 4.72C7.85 5.11 7.74 5.55 7.43 5.85L5.76 7.52C7.28 10.53 9.47 12.72 12.48 14.24L14.15 12.57C14.45 12.26 14.89 12.15 15.28 12.29C16.19 12.6 17.14 12.82 18.12 12.93C18.61 12.99 18.98 13.4 18.98 13.9V16.9C19 17.48 18.53 17.96 17.96 17.99C17.71 18 17.45 18.01 17.2 18.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="info-content">
              <h3>Phone</h3>
              <a href="tel:+2347050213929">+234 705 021 3929</a>
            </div>
          </div>
        </div>

        <div class="contact-form-section">
          <h2>Send Me a Message</h2>
          <form class="contact-form" action="mailto:ifedayoakisanya@gmail.com" method="post" enctype="text/plain">
            <div class="form-group">
              <label for="yourName">Your Name</label>
              <input type="text" id="yourName" name="yourName" placeholder="John Doe" required>
            </div>

            <div class="form-group">
              <label for="yourEmail">Your Email</label>
              <input type="email" id="yourEmail" name="yourEmail" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
              <label for="message">Your Message</label>
              <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">
              <span>Send Message</span>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M17.5 2.5L8.75 11.25M17.5 2.5L12.5 17.5L8.75 11.25M17.5 2.5L2.5 7.5L8.75 11.25" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
